name: Test & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    # 저장소 Settings → Pages → Source 를 "GitHub Actions"로 켠 뒤에만 배포한다
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: API 키 주입 (Secrets: GOOGLE_MAPS_API_KEY, Variables: GOOGLE_MAP_ID)
        env:
          KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          MAP_ID: ${{ vars.GOOGLE_MAP_ID }}
        run: |
          node -e "
            const fs = require('fs');
            let s = fs.readFileSync('config.js', 'utf8');
            s = s.replace(\"googleMapsApiKey: ''\", 'googleMapsApiKey: ' + JSON.stringify(process.env.KEY || ''));
            s = s.replace(\"mapId: ''\", 'mapId: ' + JSON.stringify(process.env.MAP_ID || ''));
            fs.writeFileSync('config.js', s);
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
